name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'
      - name: Compile and test
        run: |
          python -m compileall -q hagent
          python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Verify clean wheel installation
        run: |
          python -m venv /tmp/hagent-wheel-test
          /tmp/hagent-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          HAGENT_DB_PATH=/tmp/hagent-wheel-test.db /tmp/hagent-wheel-test/bin/python -c "from pathlib import Path; import hagent; from hagent import db; root=Path(hagent.__file__).parent; assert (root/'templates'/'base.html').is_file(); assert (root/'static'/'style.css').is_file(); db.init_db(); from fastapi.testclient import TestClient; from hagent.web import app; response=TestClient(app).get('/'); assert response.status_code == 200"
