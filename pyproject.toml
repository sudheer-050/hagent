[project]
name = "hagent"
version = "0.2.0"
description = "Self-hosted multi-agent orchestration platform (CLI + web dashboard) supporting pluggable AI runtimes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "apscheduler>=3.10",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
hagent = "hagent.warm:main"

[project.urls]
Homepage = "https://github.com/sudheer-050/hagent"
Repository = "https://github.com/sudheer-050/hagent"
Issues = "https://github.com/sudheer-050/hagent/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hagent*"]
