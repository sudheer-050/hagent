{% set family = {"codex_cli":"openai", "claude_code":"claude", "gemini_cli":"gemini"}.get(selected_provider, selected_provider) %}
<form method="post" action="{{ form_action }}" class="stack runtime-form" data-current-provider="{{ family }}" data-current-model="{{ selected_model }}" data-current-connection="{{ 'cli' if selected_provider in ('codex_cli','claude_code','gemini_cli') else 'local' if family == 'ollama' else 'api' }}" data-current-effort="{{ runtime_config.get('effort_selection', runtime_config.get('reasoning_effort', '')) }}" data-runtime-id="{{ runtime.id if editing else '' }}">
  <input type="hidden" name="name" value="{{ runtime_name }}">
  <input type="hidden" name="catalog_token" id="runtime-catalog-token">
  <div><label class="field-label" for="runtime-mode">Connection</label><select id="runtime-mode" autofocus><option value="api" {{ "selected" if selected_provider not in ('codex_cli','claude_code','gemini_cli') }}>API</option><option value="cli" {{ "selected" if selected_provider in ('codex_cli','claude_code','gemini_cli') }}>CLI</option></select></div>
  <input type="hidden" id="runtime-connection" name="connection">
  <div><label class="field-label" id="runtime-provider-label" for="runtime-type">Provider</label><select id="runtime-type" name="type" required>
    {% for provider in providers %}<option value="{{ provider.id }}" {{ "selected" if provider.id == family }}>{{ provider.name }}</option>{% endfor %}
  </select></div>
  <div id="runtime-key-group">
    <label class="field-label" for="runtime-api-key">API key</label>
    <input id="runtime-api-key" name="api_key" type="password" placeholder="{{ 'Leave blank to use saved key' if editing else '' }}" autocomplete="new-password">
  </div>
  <div id="runtime-base-url-group" hidden><label class="field-label" for="runtime-base-url">Server URL</label><input id="runtime-base-url" name="base_url" type="url" value="{{ runtime_config.get('base_url', '') }}" data-saved-value="{{ runtime_config.get('base_url', '') }}"></div>
  <div><button id="runtime-load-models" type="button">Load models</button><p id="runtime-model-source" class="field-help" role="status" hidden></p></div>
  <div id="runtime-model-group" hidden><label class="field-label" for="runtime-model">Model</label><select id="runtime-model" name="model" required disabled></select></div>
  <div id="runtime-effort-group" hidden><label class="field-label" for="runtime-effort">Effort</label><select id="runtime-effort" name="effort"><option value="">Provider default</option></select></div>
  <input name="command" type="hidden" value="{{ runtime_config.get('command', '') }}">
  <input name="working_directory" type="hidden" value="{{ runtime_config.get('working_directory', '') }}">
  <div class="{{ 'form-actions' if editing else 'modal-actions' }}"><button class="primary" id="runtime-save" type="submit" disabled>{{ submit_label }}</button></div>
</form>
