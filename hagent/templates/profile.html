{% extends "base.html" %}
{% block content %}
<h2>Profile</h2>
{% if profile %}
<div class="card"><h3>{{ profile.name or "Your profile" }}</h3><p>{{ profile.email }}</p><p>{{ profile.bio }}</p></div>
{% else %}
<div class="card"><p class="muted">No profile configured.</p></div>
{% endif %}
<form method="post" action="/profile"><label>Name <input name="name" value="{{ profile.name if profile else '' }}"></label><label>Email <input name="email" type="email" value="{{ profile.email if profile else '' }}"></label><label>Bio <textarea name="bio">{{ profile.bio if profile else '' }}</textarea></label><button>Save profile</button></form>
{% endblock %}
