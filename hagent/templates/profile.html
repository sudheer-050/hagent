{% extends 'base.html' %}
{% block content %}
<header class='page-heading'><div><h1>Profile</h1><p class='muted'>Your workspace details.</p></div></header>
<section class='profile-panel'>
<form method='post' action='/profile' class='profile-form'>
<label>Name<input name='name' value='{{ profile.name if profile else '' }}' placeholder='Your name'></label>
<label>Email<input name='email' type='email' value='{{ profile.email if profile else '' }}' placeholder='you@example.com'></label>
<label>About you<textarea name='bio' rows='5' placeholder='A little about you...'>{{ profile.bio if profile else '' }}</textarea></label>
<button class='primary' type='submit'>Save profile</button>
</form></section>
{% endblock %}
