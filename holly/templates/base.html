<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Holly{% endblock %}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 1000px; margin: 2rem auto; color: #1a1a1a; }
    h1 { margin-bottom: 0.2rem; }
    h2 { margin-top: 2.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    th { color: #666; font-weight: 600; }
    code { background: #f5f5f5; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85rem; }
    .status-completed { color: #1a7f37; }
    .status-failed { color: #d1242f; }
    .status-running, .status-pending { color: #9a6700; }
    form.inline { display: inline; }
    input, select, textarea, button { font-size: 0.9rem; padding: 0.3rem 0.5rem; margin: 0.15rem 0; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-top: 0.5rem; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1><a href="/">Holly</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
